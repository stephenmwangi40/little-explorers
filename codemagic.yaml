# Alternative to GitHub Actions: Codemagic (free tier includes macOS minutes).
# In Codemagic: add the repo, connect your App Store Connect API key under
# Teams > Integrations (name it "ASC"), then start the "ios-release" workflow.
workflows:
  ios-release:
    name: iOS / iPadOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ASC
    environment:
      flutter: 3.47.7
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stephenmwangi.littleExplorers
    scripts:
      - flutter pub get
      - flutter test
      - xcode-project use-profiles
      - flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
