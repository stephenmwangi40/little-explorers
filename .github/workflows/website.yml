# Publishes the information website + support system.
# - GitHub Pages: static copy (the support form talks to the Cloudflare API).
# - Cloudflare Pages: website, support API (Pages Functions) and D1 database.
#   Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
#   The admin password comes from the ADMIN_PASSWORD repository secret.
# The whole support system is tested locally before anything goes live.
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', 'functions/**', 'wrangler.toml', 'cloudflare/**', '.github/workflows/website.yml']

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  test-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the support system end to end (local copy)
        run: bash cloudflare/test-api.sh

  github-pages:
    needs: test-support
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4

  cloudflare:
    needs: test-support
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_ADMIN: ${{ secrets.ADMIN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.HAS_CF == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ env.HAS_CF == 'true' }}
        with:
          node-version: 22
      - name: Set the admin password
        if: ${{ env.HAS_CF == 'true' && env.HAS_ADMIN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 pages secret put ADMIN_PASSWORD --project-name=little-explorers-app
      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --project-name=little-explorers-app --branch=main
      - name: Skipped
        if: ${{ env.HAS_CF != 'true' }}
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish on Cloudflare."
