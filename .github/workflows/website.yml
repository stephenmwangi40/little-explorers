# Publishes the information website (website/) to GitHub Pages, and to
# Cloudflare Pages when CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets are set.
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4

  cloudflare:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.HAS_CF == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ env.HAS_CF == 'true' }}
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creates the Pages project the first time, then deploys.
          npx --yes wrangler@4 pages project create little-explorers-app --production-branch=main || true
          npx --yes wrangler@4 pages deploy website --project-name=little-explorers-app --branch=main
      - name: Skipped
        if: ${{ env.HAS_CF != 'true' }}
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to also publish on Cloudflare."
